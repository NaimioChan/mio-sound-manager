[workspace]
resolver = "3"
members = [
    "crates/mio-engine",
    "crates/mio-index",
    "crates/mio-cli",
    "crates/mio-app",
]
# The Tauri shell needs a built webview bundle before it can compile, so it is
# deliberately not a default member: `cargo build` / `cargo test` at the root
# keep working with no npm step. Build it explicitly with
#   ./tools/build-app.sh          (release)
#   cargo build -p mio-app     (after `cd ui && npm run build`)
default-members = ["crates/mio-engine", "crates/mio-index", "crates/mio-cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
