<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>ReSlip P0 — drag into a DAW</title>
<style>
  :root {
    --fg: #e8eaed;
    --dim: #9aa0a6;
    --line: #2f3136;
    --card: #1c1e21;
    --accent: #3389d1;
    --ok: #4caf7d;
    --bad: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #131416; color: var(--fg);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  body { padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 12px; margin: 0; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; cursor: grab; display: flex; gap: 10px; align-items: center;
  }
  .item:hover { border-color: var(--accent); }
  .item:active { cursor: grabbing; }
  .item.dragging { border-color: var(--accent); background: #20242a; }
  .badge {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 6px;
    background: var(--accent); color: #fff; display: grid; place-items: center;
    font-size: 9px; font-weight: 700; letter-spacing: .3px;
  }
  .meta { min-width: 0; }
  .name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .path { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .multi {
    border: 1px dashed var(--line); border-radius: 8px; padding: 9px 12px;
    color: var(--dim); cursor: grab; text-align: center; font-size: 12px;
  }
  .multi:hover { border-color: var(--accent); color: var(--fg); }
  .status {
    margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px;
    font-size: 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .row { display: flex; gap: 8px; }
  .k { color: var(--dim); flex: 0 0 74px; }
  .v { font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  #toggle { margin-left: auto; color: var(--dim); cursor: pointer; font-size: 11px; }
  #toggle:hover { color: var(--fg); }
</style>
</head>
<body>
  <h1>ReSlip P0 — 拖拽导出</h1>
  <p class="sub">按住左键拖到 REAPER / FL Studio / Bitwig，松手。每条结果会记进 <code>p0-drag.log</code>。</p>

  <div class="list" id="list"></div>
  <div class="multi" id="multi">拖全部 4 个文件</div>

  <div class="status">
    <div class="row"><span class="k">插件</span><span class="v" id="s1">检查中…</span></div>
    <div class="row"><span class="k">上次拖动</span><span class="v" id="s2">—</span></div>
    <div class="row"><span class="k">返回值</span><span class="v" id="s3">—</span></div>
    <div class="row"><span class="k">次数</span><span class="v" id="s4">0</span><span id="toggle">显示路径</span></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const api = window.__TAURI__;
let attempts = 0;
let showPaths = false;

// Blue drag image, inline so the probe has no asset dependency.
const ICON = "data:image/png;base64," +
  "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAABA0lEQVR4nO2aQQqDMBREJ0N6g656CFeezUN4tqw8RFe9" +
  "QReWQgUJGhWrPyN54CIQ4syfn9UPULDFrdnU9/0TBjjnHot7chS+xYhbI7xuuxsMCE31XjLiUuKthKeMxCaIGXIRv6SF" +
  "U9XPSfzAoClu79kEVKBC9VMpXCeBfxOa6v79cDCEOLQWEHYmZW5gL1Tq9ylKAtZJEeJQqd9lEggbipSlgS0UA9YQ4hDi" +
  "EOIQ4hDieGRI3XavwwxsOfwMCHH8mT87Ij1CHP+PQyzvBSGOtxZQ70yvJGB9LxhPPuKxTk6En7bxlEa+hThe5JxCmKh+" +
  "MoGcTISEluuNWS8x6FZ6alCAMR/v6nF2JRJPjAAAAABJRU5ErkJggg==";

function log(line) {
  try { api.core.invoke("log_line", { line }); } catch (e) { /* probe: ignore */ }
}

function setResult(text, cls) {
  const el = $("s2");
  el.textContent = text;
  el.className = "v " + (cls || "");
}

async function startDrag(paths, label) {
  if (!api || !api.drag) {
    setResult("插件未加载", "bad");
    log(`FAIL plugin missing label=${label}`);
    return;
  }
  attempts += 1;
  $("s4").textContent = String(attempts);
  setResult("拖动中… " + label);
  $("s3").textContent = "—";
  log(`BEGIN label=${label} n=${paths.length} paths=${JSON.stringify(paths)}`);

  try {
    await api.drag.startDrag(
      { item: paths, icon: ICON, mode: "copy" },
      (res) => {
        log(`CB raw=${JSON.stringify(res)}`);
        const r = res && res.result ? res.result : JSON.stringify(res);
        $("s3").textContent = r + (res && res.cursorPos ? ` @${res.cursorPos.x},${res.cursorPos.y}` : "");
        setResult(r === "Dropped" ? "已投放到目标窗口" : "被取消 / 未投放",
                  r === "Dropped" ? "ok" : "bad");
        log(`END label=${label} result=${r} cursor=${res && res.cursorPos ? res.cursorPos.x + "," + res.cursorPos.y : "?"}`);
      }
    );
    // Reaching here means the command itself returned. Distinguishes "DoDragDrop
    // never returned" from "the onEvent channel never delivered".
    log(`RETURN label=${label} lastResult=${$("s3").textContent}`);
    if ($("s2").textContent.startsWith("拖动中")) setResult("命令已返回，未收到结果回调");
  } catch (err) {
    setResult("调用失败", "bad");
    $("s3").textContent = String(err);
    log(`ERROR label=${label} err=${String(err)}`);
  }
}

// OLE drag must begin while the left button is still down, so we start on
// pointerdown rather than on a click (click fires after release).
function attach(el, getPaths, getLabel) {
  el.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    ev.stopPropagation();
    el.classList.add("dragging");
    const paths = getPaths();
    startDrag(paths, getLabel()).finally(() => el.classList.remove("dragging"));
  });
  el.addEventListener("dragstart", (ev) => ev.preventDefault());
}

async function boot() {
  if (!api) {
    $("s1").textContent = "window.__TAURI__ 缺失";
    $("s1").className = "v bad";
    return;
  }
  $("s1").textContent = api.drag ? "drag 已注册" : "drag 未注册";
  $("s1").className = "v " + (api.drag ? "ok" : "bad");

  let samples = [];
  try {
    samples = await api.core.invoke("samples");
  } catch (e) {
    $("s1").textContent = "samples 命令失败: " + String(e);
    return;
  }

  const list = $("list");
  list.innerHTML = "";
  for (const s of samples) {
    const row = document.createElement("div");
    row.className = "item";

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = s.format || "?";

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = s.name;
    const path = document.createElement("div");
    path.className = "path";
    path.textContent = showPaths ? s.path : `${(s.bytes / 1024).toFixed(1)} KB`;
    meta.append(name, path);

    row.append(badge, meta);
    attach(row, () => [s.path], () => s.name);
    list.append(row);
  }

  attach($("multi"), () => samples.map((s) => s.path), () => `all-${samples.length}`);

  $("toggle").addEventListener("click", () => {
    showPaths = !showPaths;
    boot();
  });

  log(`READY samples=${samples.length} plugin=${api.drag ? "yes" : "no"}`);
}

boot();
</script>
</body>
</html>
