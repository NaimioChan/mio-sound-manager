[package]
name = "mio-engine"
description = "Decoding, dual-slot scheduling and WASAPI shared-mode output"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
symphonia = { version = "0.5.5", features = ["all-formats", "all-codecs"] }
wasapi = "0.27"
# ASIO is opt-in. The Steinberg SDK is proprietary and cannot be redistributed,
# and `asio-sys` builds it with bindgen (needs a libclang DLL), so a default
# build must not depend on either. `cargo build --features asio` turns it on.
asio-sys = { version = "0.4", optional = true }
rubato = "5.1"
arc-swap = "1.9"
crossbeam-queue = "0.3"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Foundation"] }
thiserror = "2"
log = "0.4"

[features]
default = []
# WASAPI shared mode is always compiled in. This adds the ASIO backend and the
# ASIO half of the device picker. `tools/build-app.sh` sets the two environment
# variables `asio-sys` needs; see `src/asio.rs`.
asio = ["dep:asio-sys"]
