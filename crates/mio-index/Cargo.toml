[package]
name = "mio-index"
description = "Library indexing: schema, header-only probing, classification, search"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1.1"
symphonia = { version = "0.5.5", features = ["all-formats", "all-codecs"] }
symphonia-metadata = "0.5.5"
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1.11"
walkdir = "2.5"
thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
# Cover identity: SHA-256 of the picture bytes, truncated to 128 bits. Chosen over
# a faster non-cryptographic hash because two different pictures colliding would
# merge their rows under "same cover", which is a visible lie.
sha2 = "0.10"
