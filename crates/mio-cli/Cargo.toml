[package]
name = "mio-cli"
description = "P1 acceptance harness: play a file from the command line, print measured latency"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mio-cli"
path = "src/main.rs"

[features]
default = []
# Mirrors the engine's feature: the CLI is the acceptance harness, and the point
# of an ASIO backend is a measured number from a real driver.
asio = ["mio-engine/asio"]

[dependencies]
mio-engine = { path = "../mio-engine" }
mio-index = { path = "../mio-index" }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
rayon = "1.11"
