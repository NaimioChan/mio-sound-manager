[package]
name = "reslip-app"
description = "ReSlip desktop shell: Tauri window + the IPC surface the renderer talks to"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "reslip_app"
crate-type = ["lib"]

[[bin]]
name = "reslip"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reslip-engine = { path = "../reslip-engine" }
reslip-index = { path = "../reslip-index" }
# `custom-protocol` is what makes Tauri embed `ui/dist` into the binary instead of
# pointing the webview at the dev server. Without it a release build still launches
# the webview at `devUrl` (localhost:1420) and shows a blank window when Vite is
# not running — which is exactly what happened on the first run of this crate.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-drag = "2.1.1"
# Native folder picker. `window.prompt` was P3's placeholder; a sample manager is
# opened by pointing at a folder, so the picker is part of the interaction model
# (`AGENTS.md`: the UI/UX is inherited), not a nicety.
tauri-plugin-dialog = "2"
# "Reveal in File Manager" and opening the library folder from the sidebar.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
