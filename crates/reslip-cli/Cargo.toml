[package]
name = "reslip-cli"
description = "P1 acceptance harness: play a file from the command line, print measured latency"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "reslip-cli"
path = "src/main.rs"

[dependencies]
reslip-engine = { path = "../reslip-engine" }
reslip-index = { path = "../reslip-index" }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
rayon = "1.11"
